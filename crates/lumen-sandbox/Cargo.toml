[package]
name = "lumen-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lumen - wasmtime sandbox with deterministic config and capability-gated host imports"
keywords.workspace = true
categories.workspace = true

# wasmtime FFI requires `unsafe`. Override the workspace deny rule locally and
# enforce documented `// SAFETY:` blocks via clippy.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
lumen-core.workspace = true
lumen-capability.workspace = true
wasmtime.workspace = true
tokio = { workspace = true }
parking_lot.workspace = true
serde = { workspace = true }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
wat.workspace = true
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
