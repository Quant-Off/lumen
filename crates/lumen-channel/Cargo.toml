[package]
name = "lumen-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lumen - typed async secure channels (in-process; AES-GCM/x25519 behind feature)"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
crypto-channel = ["dep:elib-aes", "dep:elib-x25519", "dep:elib-zeroize"]

[dependencies]
lumen-core.workspace = true
lumen-attestation.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
serde = { workspace = true }
postcard.workspace = true
thiserror.workspace = true
elib-aes = { workspace = true, optional = true }
elib-x25519 = { workspace = true, optional = true }
elib-zeroize = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
