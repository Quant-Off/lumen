[package]
name = "lumen-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lumen - InferenceEngine trait + streaming + verified loader + quantization config; candle/llama.cpp behind feature flags"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# ONNX 라우팅 엔진 (candle-onnx 기반, 기존 CandleEngine).
# 폐쇄망 배포에서는 cargo vendor 로 candle 소스를 미리 가져와야 합니다 -
# `AIR-GAPPED.md` 가이드 참고.
candle = ["dep:candle-core", "dep:candle-onnx"]
# llama.cpp 백엔드 (cmake 빌드 필요, 현재 인터페이스 스텁).
# 전체 LLM 텍스트 생성이 필요한 경우 이 백엔드를 사용하세요.
llama-cpp = []

[dependencies]
lumen-core.workspace = true
lumen-channel.workspace = true
lumen-provenance.workspace = true
lumen-fixed.workspace = true
async-trait.workspace = true
futures.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
candle-core = { workspace = true, optional = true }
candle-onnx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
