[package]
name = "lumen-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lumen - InferenceEngine/StreamingEngine traits, backend registry, verified loader, quantization, minimal BPE tokenizer; llama.cpp server backend behind feature flag"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# llama.cpp 백엔드. 호스트(TEE) 측에서 격리된 프로세스로 실행되는
# `llama-server` 를 Unix 도메인 소켓 / loopback TCP 로 연결합니다.
# 순수 Rust 로만 구성되며 (자체 HTTP/1.1 + SSE 클라이언트) cmake / bindgen /
# libclang 없이 폐쇄망에서 빌드됩니다. 엔진 바이너리와 모델 파일은 모두
# BLAKE3 핀으로 검증된 뒤에만 기동됩니다.
llama-server = ["tokio/net", "tokio/process", "tokio/time", "tokio/io-util"]

[dependencies]
lumen-core.workspace = true
lumen-channel.workspace = true
lumen-provenance.workspace = true
lumen-fixed.workspace = true
async-trait.workspace = true
futures.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
