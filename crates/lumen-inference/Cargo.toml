[package]
name = "lumen-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lumen - InferenceEngine trait + streaming + verified loader + quantization + minimal BPE tokenizer; llama.cpp behind feature flag"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# llama.cpp 백엔드 (cmake 빌드 필요, 현재 인터페이스 스텁).
# 전체 LLM 텍스트 생성이 필요한 경우 이 백엔드를 사용하세요.
llama-cpp = []

[dependencies]
lumen-core.workspace = true
lumen-channel.workspace = true
lumen-provenance.workspace = true
lumen-fixed.workspace = true
async-trait.workspace = true
futures.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
