[package]
name = "lumen-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lumen - InferenceEngine trait + dummy backend; candle/llama.cpp behind feature flags"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
candle = ["dep:candle-core", "dep:candle-onnx"]

[dependencies]
lumen-core.workspace = true
lumen-channel.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
candle-core = { workspace = true, optional = true }
candle-onnx = { workspace = true, optional = true }
blake3 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
