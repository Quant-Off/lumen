# cargo-deny 구성
# 제로 트러스트 철학에 따른 엄격한 공급망 태세 강제

[graph]
all-features = true
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # rustls 강제화; openssl-sys는 C를 끌어와서 감사를 복잡하게 함
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # No legacy hashes
    { name = "md5" },
    { name = "sha1" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
