# cargo-deny 구성
# 제로 트러스트 철학에 따른 엄격한 공급망 태세 강제

[graph]
all-features = true
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` 는 archived/unmaintained 이지만 eager macro expansion 만 수행하는
    # 작은 proc-macro 크레이트로 알려진 취약점이 없습니다. 우리 직접 의존이
    # 아니라 `candle-core` → `gemm` / `tokenizers` / `pulp` 트리(즉 `candle`
    # feature 활성화 시에만)에서만 옵니다. Drop-in 대체(`pastey`)가 있지만
    # 상위 크레이트들이 채택하기 전까지는 회피 불가.
    { id = "RUSTSEC-2024-0436", reason = "transitive via candle-core (feature-gated), no upstream alternative yet" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # rustls 강제화; openssl-sys는 C를 끌어와서 감사를 복잡하게 함
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # No legacy hashes
    { name = "md5" },
    { name = "sha1" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
