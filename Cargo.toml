[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["agents/*"]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["Q. T. Felix <qtfelix@qu4nt.space>"]
repository = "https://github.com/Quant-Off/lumen"
homepage = "https://github.com/Quant-Off/lumen"
description = "High-security verifiable Rust AI-agent framework for zero-trust / air-gapped environments"
keywords = ["ai", "agent", "security", "wasm", "zkml"]
categories = ["wasm", "cryptography", "command-line-utilities"]

[workspace.dependencies]
# In-workspace crates
lumen-core = { path = "crates/lumen-core", version = "0.4.1" }
lumen-fixed = { path = "crates/lumen-fixed", version = "0.4.1" }
lumen-capability = { path = "crates/lumen-capability", version = "0.4.1" }
lumen-channel = { path = "crates/lumen-channel", version = "0.4.1" }
lumen-provenance = { path = "crates/lumen-provenance", version = "0.4.1" }
lumen-defense = { path = "crates/lumen-defense", version = "0.4.1" }
lumen-zkml = { path = "crates/lumen-zkml", version = "0.4.1" }
lumen-inference = { path = "crates/lumen-inference", version = "0.4.1" }
lumen-sandbox = { path = "crates/lumen-sandbox", version = "0.4.1" }
lumen-agent = { path = "crates/lumen-agent", version = "0.4.1" }
lumen-orchestrator = { path = "crates/lumen-orchestrator", version = "0.4.1" }
lumen-sdk = { path = "crates/lumen-sdk", version = "0.4.1" }
lumen-sdk-macros = { path = "crates/lumen-sdk-macros", version = "0.4.1" }
lumen-attestation = { path = "crates/lumen-attestation", version = "0.4.1" }
lumen-onchain = { path = "crates/lumen-onchain", version = "0.4.1" }

# Errors / utilities
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# default features (`heapless-cas`) 가 unmaintained `atomic-polyfill` 을 끌어옴.
# alloc/std 만 활성화해 의존 그래프에서 heapless 자체를 제거.
postcard = { version = "1", default-features = false, features = ["use-std"] }
hex = "0.4"

# Crypto 
elib-blake = { package = "blake", path = "../elib-k0-nt/blake", version = "1.0.0" }
elib-ed25519 = { package = "ed25519", path = "../elib-k0-nt/ed25519", version = "1.0.0" }
elib-x25519 = { package = "x25519", path = "../elib-k0-nt/x25519", version = "1.0.0" }
elib-aes = { package = "aes", path = "../elib-k0-nt/aes", version = "1.0.0" }
elib-rng = { package = "rng", path = "../elib-k0-nt/rng", version = "1.0.0" }
elib-constant-time = { package = "constant-time", path = "../elib-k0-nt/constant-time", version = "1.0.0" }
elib-zeroize = { package = "zeroize", path = "../elib-k0-nt/zeroize", version = "1.0.0" }

# Defense / matchers
aho-corasick = "1"
regex = "1"
once_cell = "1"
globset = "0.4"

# Concurrency
parking_lot = "0.12"

# WASM (sandbox)
# v25 -> 최신 line. RUSTSEC 다수 advisory (fd_renumber / wasi:http fields /
# 컴포넌트 model flags lift / Winch table.fill / UTF-16 transcoding panic) 패치 포함.
wasmtime = { version = "44", default-features = false, features = ["async", "cranelift", "runtime", "addr2line", "demangle"] }
wat = "1"

# Provenance — Hugging Face safetensors 헤더 sniff 용. 단독으로 동작하는
# 작은 크레이트라 폐쇄망 빌드에 무리 없이 포함됩니다.
safetensors = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / audit
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Q. T. Felix NOTE: AES-GCM / x25519는 elib-k0-nt 모듈을 사용하므로 별도 외부
#                   크레이트가 필요하지 않음(위 elib-aes / elib-x25519 워크스페이스 정의 사용)

# Dev / bench
criterion = "0.5"

# 참고: 다음 의존성은 폐쇄형(Air-Gapped) 호환성 작업으로 제거되었습니다.
#   - `halo2_proofs` / `ff` / `pasta_curves` : ZK 백엔드. mock prover 가
#     이미 BLAKE3 기반이라 halo2 회로 없이 동작합니다. 실제 succinct ZK
#     백엔드 (SP1 / RISC Zero 등) 는 마일스톤 재검토 시 결정.
#   - `candle-core` / `candle-onnx` / `candle-transformers` / `tokenizers`
#     : GGUF·ONNX 추론 백엔드. 의존 트리가 매우 크고 (`gemm`, `pulp`,
#     `paste`, `tokenizers`, `rand_core` 등) HF Hub 다운로드 코드를
#     포함하므로 폐쇄망에 부적합. 도구 라우팅용 토크나이저는 자체 구현인
#     `lumen_inference::BpeTokenizer` 를 사용하고, 전체 LLM 생성은
#     `llama-cpp` 백엔드 또는 호스트 TEE 의 ChannelEngine forward 경로를
#     사용합니다.
#   - `rand` / `rand_core` : `lumen_core::rng` (HashDRBG 어댑터) 로 대체.

[workspace.lints.rust]
# Q. T. Felix NOTE: 모든 경고를 deny 로 격상해 lumen 멤버 크레이트의 게이트로
#                   사용합니다. 과거에는 CI의 `RUSTFLAGS=-D warnings`로 같은
#                   효과를 냈으나, 그 방식은 워크스페이스 외부 path dep
#                   (`elib-k0-nt/*`) 까지 격상시켜 외부 변경에 lumen CI가
#                   끌려갔습니다. lints 테이블은 `[lints] workspace = true`
#                   를 선언한 멤버에만 적용되므로 외부 path dep에 영향을
#                   주지 않습니다. priority -2로 가장 먼저 emit시켜 이후
#                   특정 lint(warn 레벨)가 자유롭게 덮어쓸 수 있도록 합니다.
warnings = { level = "deny", priority = -2 }
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Q. T. Felix NOTE: `all` 그룹(정확성/의심/스타일/복잡성/성능)이 기본 게이트웨이입니다.
#                   CI의 `-D warnings` 설정이 코드 퇴보를 거부할 수 있도록 해당 항목들을 경고(warn)로 처리합니다.
#                   `pedantic` 그룹은 실제 문제를 가릴 정도로 노이즈가 심하기 때문에 워크스페이스 전체에 활성화하지 않았습니다.
#                   엄격한 감사가 필요한 크레이트는 개별적으로 해당 설정을 추가할 수 있습니다.
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
