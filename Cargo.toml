[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["agents/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0 OR MIT"
authors = ["Lumen contributors"]
repository = "https://github.com/qtfelix/lumen"
homepage = "https://github.com/qtfelix/lumen"
description = "High-security verifiable Rust AI-agent framework for zero-trust / air-gapped environments"
keywords = ["ai", "agent", "security", "wasm", "zkml"]
categories = ["wasm", "cryptography", "command-line-utilities"]

[workspace.dependencies]
# In-workspace crates
lumen-core = { path = "crates/lumen-core", version = "0.2.0" }
lumen-fixed = { path = "crates/lumen-fixed", version = "0.2.0" }
lumen-capability = { path = "crates/lumen-capability", version = "0.2.0" }
lumen-channel = { path = "crates/lumen-channel", version = "0.2.0" }
lumen-provenance = { path = "crates/lumen-provenance", version = "0.2.0" }
lumen-defense = { path = "crates/lumen-defense", version = "0.2.0" }
lumen-zkml = { path = "crates/lumen-zkml", version = "0.2.0" }
lumen-inference = { path = "crates/lumen-inference", version = "0.2.0" }
lumen-sandbox = { path = "crates/lumen-sandbox", version = "0.2.0" }
lumen-agent = { path = "crates/lumen-agent", version = "0.2.0" }
lumen-orchestrator = { path = "crates/lumen-orchestrator", version = "0.2.0" }
lumen-sdk = { path = "crates/lumen-sdk", version = "0.2.0" }
lumen-attestation = { path = "crates/lumen-attestation", version = "0.2.0" }

# Errors / utilities
thiserror = "1"
anyhow = "1"

# Async runtime
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
postcard = { version = "1", features = ["use-std"] }
hex = "0.4"

# Crypto
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_core = "0.6"
subtle = "2"

# Defense / matchers
aho-corasick = "1"
regex = "1"
once_cell = "1"
globset = "0.4"

# Concurrency
parking_lot = "0.12"

# WASM (sandbox)
wasmtime = { version = "25", default-features = false, features = ["async", "cranelift", "runtime", "addr2line", "demangle"] }
wat = "1"

# Provenance
safetensors = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / audit
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Optional crypto-channel feature
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Dev / bench
criterion = "0.5"

# halo2 (ZK 회로) - 매우 무거운 의존성. feature 뒤에서만 활성화.
halo2_proofs = "0.3"
ff = "0.13"
pasta_curves = "0.5"

# candle (LLM 추론) - feature 뒤에서만 활성화. CPU 전용 빌드.
candle-core = { version = "0.10", default-features = false }
candle-onnx = { version = "0.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# `all` (correctness/suspicious/style/complexity/perf groups) is the gate; we
# treat its hits as warnings so CI's `-D warnings` rejects regressions. We
# deliberately do NOT enable the `pedantic` group workspace-wide: it produces
# a high noise-to-signal ratio that hides real issues. Crates that want
# pedantic auditing can opt in locally.
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
