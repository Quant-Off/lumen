# 폐쇄형(Air-Gapped) 빌드용 cargo source-replacement.
#
# 모든 외부 크레이트 소스는 `vendor/` 에 고정되어 저장소와 함께 커밋됩니다.
# crates.io 접근을 vendor/ 로 대체하고 net.offline 을 강제하므로, 온라인 /
# 폐쇄망 어디서든 동일한 소스로 빌드됩니다. 외부 fetch 시도가 있으면 빌드가
# 즉시 실패하여 폐쇄망 정책 위반을 컴파일 시점에 차단합니다.
#
# 의존성 추가 / 갱신 절차:
#   1. Cargo.toml 수정
#   2. ./scripts/vendor.sh          # Cargo.lock 갱신 + vendor/ 재동기화
#   3. 4-게이트 + cargo deny check 통과 확인
#   4. Cargo.toml / Cargo.lock / vendor/ 를 함께 커밋
#
# 무결성: 각 vendor/<crate>/.cargo-checksum.json 이 파일별 SHA-256 을 담고
# 있으며 cargo 가 빌드 시 검증합니다. Cargo.lock 의 checksum 과 함께 이중
# 고정됩니다.

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true
