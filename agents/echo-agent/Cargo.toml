[workspace]
# 이 에이전트는 wasm32-unknown-unknown 전용으로 빌드되며, 메인 워크스페이스의
# 빌드 그래프와 결합되면 다른 멤버가 wasm 타겟으로 컴파일을 시도하게 되므로
# 별도의 빈 워크스페이스로 분리합니다.

[package]
name = "lumen-echo-agent"
version = "0.2.0"
edition = "2021"
publish = false
description = "Lumen 데모 에이전트 - wasm32-unknown-unknown 으로 빌드되어 Lumen 샌드박스에서 실행됩니다"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
lumen-sdk = { path = "../../crates/lumen-sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
