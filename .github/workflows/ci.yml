name: CI

on:
  push:
    branches: [master]
  pull_request:

# 워크플로우 전체에서 GHCR push (image 잡) 와 pull (다른 잡) 권한이 필요합니다.
permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # Q. T. Felix NOTE: 과거에는 `RUSTFLAGS: -D warnings` 를 워크플로우 전역으로
  #                   걸었으나, 이 환경변수는 워크스페이스 외부 path dep
  #                   (`../elib-k0-nt/*`) 컴파일에도 그대로 적용되어 외부
  #                   레포의 사소한 dead_code 경고가 lumen CI 를 깨뜨리는
  #                   문제가 있었습니다. 동등한 게이트는 이제 워크스페이스
  #                   `[workspace.lints.rust]` 의 `warnings = "deny"` 로
  #                   lumen 멤버에만 한정해 적용됩니다. clippy 게이트는
  #                   여전히 `cargo clippy ... -- -D warnings` 로 수행하며,
  #                   이 인자는 primary package (lumen 멤버) 에만 적용됩니다.

jobs:
  # ---------------------------------------------------------------------------
  # CI 베이스 이미지: Dockerfile.ci + rust-toolchain.toml 의 해시를 태그로 사용해
  # 입력이 변하지 않으면 BuildKit GHA 캐시로 재빌드 없이 그대로 재사용합니다.
  # 모든 후속 잡이 이 이미지(`needs: image`)를 컨테이너로 받아 동일 환경에서
  # 실행됩니다 — local Docker 와 CI 동작이 비트 단위로 일치합니다.
  # ---------------------------------------------------------------------------
  image:
    name: build CI image
    runs-on: ubuntu-latest
    # 후속 잡의 `container.image` 는 `env` context 를 평가할 수 없으므로
    # 전체 이미지 경로를 outputs 로 노출합니다. 또한 GHCR 은 레포지토리명에
    # 소문자만 허용하므로 owner 를 소문자화합니다.
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_latest: ${{ steps.meta.outputs.image_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: compute image tag
        id: meta
        run: |
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER}/lumen-ci"
          TAG=$(cat .github/docker/Dockerfile.ci rust-toolchain.toml | sha256sum | cut -c1-16)
          echo "image=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "이미지: ${REPO}:${TAG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push CI image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/Dockerfile.ci
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha,scope=lumen-ci
          cache-to: type=gha,scope=lumen-ci,mode=max

  # ---------------------------------------------------------------------------
  # 빌드 + 테스트 (Linux 컨테이너).
  # ---------------------------------------------------------------------------
  build-test:
    name: build & test (linux)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo build (no default features)
        run: cargo build --workspace --no-default-features --locked
      - name: build wasm32 echo-agent
        working-directory: agents/echo-agent
        run: cargo build --release --target wasm32-unknown-unknown --locked

  # ---------------------------------------------------------------------------
  # 빌드 + 테스트 (macOS native).
  # macOS 는 Linux 컨테이너를 지원하지 않으므로 별도 native runner 에서
  # 동일한 toolchain (`rust-toolchain.toml` 이 강제) 으로 검증합니다.
  # ---------------------------------------------------------------------------
  build-test-macos:
    name: build & test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - name: install protoc
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo build (no default features)
        run: cargo build --workspace --no-default-features --locked
      - name: build wasm32 echo-agent
        working-directory: agents/echo-agent
        run: cargo build --release --target wasm32-unknown-unknown --locked

  # ---------------------------------------------------------------------------
  # 폐쇄 환경(Air-Gapped) 호환성: `--offline` 빌드로 네트워크 fetch 없이도
  # 워크스페이스가 빌드되는지 검증합니다. 의존성은 사전에 한 번만 받아오고,
  # 그 이후의 `--offline` 단계가 통과해야 진짜 폐쇄망 배포 가능 상태입니다.
  #
  # 참고:
  #   - `lumen-zkml` 의 `halo2` feature 는 v0.4 에서 제거되었습니다.
  #   - `lumen-inference` 의 `candle` feature 도 v0.4 에서 제거되었습니다
  #     (`tokenizers` / `rand_core` 등 외부 의존 트리 정리). 도구 라우팅용
  #     토크나이저는 자체 구현 `lumen_inference::BpeTokenizer` 를 사용합니다.
  # ---------------------------------------------------------------------------
  air-gapped:
    name: air-gapped (--offline)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - uses: Swatinem/rust-cache@v2
      - name: cargo fetch (online, one-shot)
        run: cargo fetch --locked
      - name: cargo build --offline (default features)
        run: cargo build --workspace --all-targets --locked --offline
      - name: cargo build --offline (no default features)
        run: cargo build --workspace --no-default-features --locked --offline
      - name: cargo test --offline
        run: cargo test --workspace --locked --offline

  # ---------------------------------------------------------------------------
  # Lint: clippy + rustfmt.
  # ---------------------------------------------------------------------------
  lint:
    name: clippy & fmt
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Rustdoc: 깨진 intra-doc link 거부.
  # ---------------------------------------------------------------------------
  docs:
    name: cargo doc
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------------
  # Supply-chain: license/banned/yanked check (cargo-deny 는 이미지에 사전 설치).
  # ---------------------------------------------------------------------------
  deny:
    name: cargo deny
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - run: cargo deny check

  # ---------------------------------------------------------------------------
  # RustSec advisory audit (cargo-audit 는 이미지에 사전 설치).
  # ---------------------------------------------------------------------------
  audit:
    name: cargo audit
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-deps
      - run: cargo audit
